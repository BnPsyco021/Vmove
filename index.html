<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Para a Eduarda ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap');
        
        body { 
            margin: 0; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-family: 'Poppins', sans-serif; 
            /* Imagem de fundo com filtro escuro para o texto se destacar */
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), 
                        url('https://imgur.com/CSbsJgo.png'); 
            background-size: cover; 
            background-position: center;
            background-repeat: no-repeat;
            text-align: center; 
            color: white; 
        }

        .card { 
            background: rgba(255, 255, 255, 0.15); 
            backdrop-filter: blur(15px); 
            padding: 3rem; 
            border-radius: 30px; 
            width: 90%; 
            max-width: 400px; 
            border: 1px solid rgba(255, 255, 255, 0.3); 
        }

        button { 
            padding: 12px 25px; 
            font-size: 16px; 
            font-weight: 600; 
            border: none; 
            border-radius: 50px; 
            cursor: pointer; 
            transition: 0.3s; 
            margin: 10px; 
        }

        #btnNormal { background: #fff; color: #a18cd1; }
        #btnSim { background: #fff; color: #ff4757; }
        #btnNao { background: #ff4757; color: #fff; }
        .btn-container { display: flex; justify-content: center; gap: 20px; margin-top: 20px; transition: 0.5s; }
        button:hover { transform: scale(1.1); }
    </style>
</head>
<body>

    <div class="card" id="card">
        <div id="intro">
            <h1>Eduarda, minha cacheadinha...</h1>
            <p>Queria saber se posso fazer uma perguntinha especial pra você?</p>
            <button id="btnNormal" onclick="irParaPedido()">Pode sim! ❤️</button>
        </div>

        <div id="pedido" style="display:none;">
            <h1>Quer namorar comigo?</h1>
            <div class="btn-container" id="container">
                <button id="btnSim" onclick="confirmar()">Sim, aceito! ❤️</button>
                <button id="btnNao" onmouseover="trocarPosicao()">Não</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAJrN-q8xptgkvfSssIIONOxVhgSNn86Gk",
            authDomain: "fugitivos-clt.firebaseapp.com",
            databaseURL: "https://fugitivos-clt-default-rtdb.firebaseio.com",
            projectId: "fugitivos-clt",
            storageBucket: "fugitivos-clt.firebasestorage.app",
            messagingSenderId: "974025214475",
            appId: "1:974025214475:web:8b788792d932a7146b550e",
            measurementId: "G-7519PZRJ49"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.irParaPedido = () => { 
            document.getElementById('intro').style.display = 'none'; 
            document.getElementById('pedido').style.display = 'block'; 
        };
        
        window.trocarPosicao = () => { 
            const c = document.getElementById('container'); 
            c.style.flexDirection = c.style.flexDirection === 'row-reverse' ? 'row' : 'row-reverse'; 
        };
        
        window.confirmar = () => {
            const dados = {
                nome: "Eduarda",
                status: "ACEITO",
                timestamp: new Date().toISOString()
            };
            
            set(ref(db, 'namoro_certificado'), dados).then(() => {
                document.getElementById('card').innerHTML = "<h1>Eu sabia! ❤️</h1><p>Prometo fazer de tudo pra dar certo, vc não vai se arrepender. I love You Baby💍!</p>";
            });
        };
    </script>
</body>
</html>
