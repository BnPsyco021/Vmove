<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nosso Amor</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts for elegant typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #121214; /* Dark gray */
            color: #e1e1e6;
            overflow-x: hidden;
        }
        
        .font-cursive {
            font-family: 'Dancing Script', cursive;
        }

        /* Heartbeat Animation */
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            14% { transform: scale(1.1); }
            28% { transform: scale(1); }
            42% { transform: scale(1.1); }
            70% { transform: scale(1); }
        }

        .animate-heartbeat {
            animation: heartbeat 2s infinite;
        }

        /* Floating elements background */
        .bg-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }

        .shape {
            position: absolute;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.15) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            filter: blur(40px);
        }

        /* Glassmorphism for cards */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(168, 85, 247, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start relative">

    <!-- Ambient glowing backgrounds -->
    <div class="bg-shapes">
        <div class="shape w-96 h-96 -top-20 -left-20 bg-purple-600"></div>
        <div class="shape w-96 h-96 top-1/2 right-0 transform translate-x-1/2 bg-purple-800"></div>
        <div class="shape w-80 h-80 -bottom-20 -left-10 bg-purple-500"></div>
    </div>

    <!-- Main Container (Mobile focused width) -->
    <main class="w-full max-w-md mx-auto p-6 flex flex-col items-center pt-12 relative z-10">

        <!-- Hero Section -->
        <div class="text-center mb-10 w-full">
            <div class="flex justify-center mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-20 w-20 text-purple-500 animate-heartbeat drop-shadow-[0_0_15px_rgba(168,85,247,0.6)]" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd" />
                </svg>
            </div>
            
            <h1 class="text-5xl font-cursive mb-2 bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-purple-600">
                Meu Amor
            </h1>
            <p class="text-gray-400 text-sm mt-2 tracking-wider uppercase font-semibold">
                Cada segundo ao seu lado é mágico
            </p>
        </div>

        <!-- Timer Section -->
        <div class="w-full glass-card rounded-3xl p-6 mb-10 relative overflow-hidden">
            <!-- Decorative border glow -->
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-purple-500 to-transparent opacity-50"></div>
            
            <h2 class="text-center text-sm text-gray-300 mb-6 uppercase tracking-widest font-semibold">
                Tempo de Felicidade
            </h2>
            
            <!-- Grid for time elements -->
            <div class="grid grid-cols-4 gap-3 text-center">
                <!-- Days -->
                <div class="flex flex-col items-center">
                    <div class="w-full aspect-square rounded-xl bg-gray-800/50 border border-purple-500/30 flex items-center justify-center shadow-[0_0_10px_rgba(168,85,247,0.1)] mb-2">
                        <span id="days" class="text-2xl md:text-3xl font-bold text-white">00</span>
                    </div>
                    <span class="text-[10px] uppercase text-purple-300 tracking-wider">Dias</span>
                </div>
                
                <!-- Hours -->
                <div class="flex flex-col items-center">
                    <div class="w-full aspect-square rounded-xl bg-gray-800/50 border border-purple-500/30 flex items-center justify-center shadow-[0_0_10px_rgba(168,85,247,0.1)] mb-2">
                        <span id="hours" class="text-2xl md:text-3xl font-bold text-white">00</span>
                    </div>
                    <span class="text-[10px] uppercase text-purple-300 tracking-wider">Horas</span>
                </div>
                
                <!-- Minutes -->
                <div class="flex flex-col items-center">
                    <div class="w-full aspect-square rounded-xl bg-gray-800/50 border border-purple-500/30 flex items-center justify-center shadow-[0_0_10px_rgba(168,85,247,0.1)] mb-2">
                        <span id="minutes" class="text-2xl md:text-3xl font-bold text-white">00</span>
                    </div>
                    <span class="text-[10px] uppercase text-purple-300 tracking-wider">Min</span>
                </div>
                
                <!-- Seconds -->
                <div class="flex flex-col items-center">
                    <div class="w-full aspect-square rounded-xl bg-gray-800/50 border border-purple-500/30 flex items-center justify-center shadow-[0_0_10px_rgba(168,85,247,0.1)] mb-2">
                        <span id="seconds" class="text-2xl md:text-3xl font-bold text-purple-400">00</span>
                    </div>
                    <span class="text-[10px] uppercase text-purple-300 tracking-wider">Seg</span>
                </div>
            </div>
            
            <div class="mt-6 text-center text-xs text-gray-500">
                Desde 27 de Setembro de 2026
            </div>
        </div>

        <!-- Message Section -->
        <div class="w-full text-center px-4">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 mx-auto text-gray-600 mb-4 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
            </svg>
            
            <p class="text-lg font-cursive text-gray-300 leading-relaxed italic">
                "Não importa quanto tempo passe, meu coração sempre vai acelerar quando estou com você. Cada instante do nosso tempo juntos é a minha melhor memória."
            </p>
            
            <div class="mt-8 mb-12 flex justify-center space-x-2">
                <span class="h-2 w-2 rounded-full bg-purple-600 opacity-80"></span>
                <span class="h-2 w-2 rounded-full bg-purple-600 opacity-50"></span>
                <span class="h-2 w-2 rounded-full bg-purple-600 opacity-30"></span>
            </div>
        </div>
        
    </main>

    <!-- Script for the Timer -->
    <script>
        // Set the start date: September 27, 2026 at 00:00:00
        const startDate = new Date('2026-09-27T00:00:00').getTime();

        function updateTimer() {
            // Get current date and time
            const now = new Date().getTime();
            
            // Find the distance between now and the start date
            // If now is after startDate, it counts up. 
            // Math.max ensures we don't get negative numbers if someone travels back in time.
            const distance = Math.max(0, now - startDate);

            // Time calculations for days, hours, minutes and seconds
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // Function to pad numbers with leading zero
            const pad = (num) => num.toString().padStart(2, '0');

            // Display the results in the corresponding elements
            document.getElementById("days").innerText = pad(days);
            document.getElementById("hours").innerText = pad(hours);
            document.getElementById("minutes").innerText = pad(minutes);
            document.getElementById("seconds").innerText = pad(seconds);
        }

        // Update the timer immediately when the page loads
        updateTimer();
        
        // Update the timer every 1 second (1000 milliseconds)
        setInterval(updateTimer, 1000);
    </script>
</body>
</html>
